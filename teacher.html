  <!-- saved name/palette + arrival curtain, before first paint -->
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('manasa:brand') || '{}');
        if (s.palette) document.documentElement.dataset.palette = s.palette;
        if (s.brand) document.documentElement.dataset.brand = s.brand;
        var nv = sessionStorage.getItem('manasa:nav');
        if (nv) { document.documentElement.classList.add('is-entering'); document.documentElement.dataset.navFrom = nv; sessionStorage.removeItem('manasa:nav'); }
        else if (!sessionStorage.getItem('manasa:seen')) document.documentElement.classList.add('is-entering');   /* first open of the site: the loader too */
        sessionStorage.setItem('manasa:seen', '1');
        var lk = sessionStorage.getItem('manasa:look');   /* loader logo: kids / adults after sign-in */
        if (lk) document.documentElement.dataset.loader = lk;
      } catch (e) {}
    })();
  </script>
